name: Verification & Benchmark Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Mathematical Verification Tests (Golden Math, Properties, Parity)
        run: |
          pytest tests/ -v

      - name: Run Mathematical Audit Suite (Hand-Verification, Integer Scaling, Statistics)
        run: |
          python scripts/audit_math_hand_verification.py
          python scripts/audit_integer_scaling_bound.py
          python scripts/audit_statistical_verification.py
          python scripts/audit_benchmark_validity.py

      - name: Run Benchmark Harness (Walk-Forward Bootstrap & Manifest Generation)
        run: |
          python scripts/run_bench.py
