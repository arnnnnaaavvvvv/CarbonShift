version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carbonshift-db
    environment:
      POSTGRES_USER: carbonshift
      POSTGRES_PASSWORD: carbonshift_secret
      POSTGRES_DB: carbonshift_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonshift -d carbonshift_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  carbonshift-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonshift-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://carbonshift:carbonshift_secret@db:5432/carbonshift_db
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    command: uvicorn carbonshift.api.app:app --host 0.0.0.0 --port 8000

  prometheus:
    image: prom/prometheus:latest
    container_name: carbonshift-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
