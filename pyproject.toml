[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonshift"
version = "1.0.0"
description = "Carbon-Aware Workload Scheduler & Trace-Replay Simulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arnav Singh", email = "arnav152007@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "ortools>=9.9.0",
    "pint>=0.23",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/carbonshift"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
