kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: carbonshift-cluster
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/region: uk-north
      topology.kubernetes.io/zone: uk-north-1
  - role: worker
    labels:
      topology.kubernetes.io/region: eu-west
      topology.kubernetes.io/zone: eu-west-1
