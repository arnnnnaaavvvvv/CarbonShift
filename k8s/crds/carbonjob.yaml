apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonjobs.carbonshift.io
spec:
  group: carbonshift.io
  names:
    kind: CarbonJob
    listKind: CarbonJobList
    plural: carbonjobs
    singular: carbonjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [deadline, template]
              properties:
                deadline:
                  type: string
                  format: date-time
                flexible:
                  type: boolean
                  default: true
                maxCarbonIntensity:
                  type: number
                regionWhitelist:
                  type: array
                  items:
                    type: string
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                assignedRegion:
                  type: string
                scheduledStartTime:
                  type: string
                  format: date-time
                carbonSavedGrams:
                  type: number
