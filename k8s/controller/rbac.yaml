apiVersion: v1
kind: Namespace
metadata:
  name: carbonshift-system
  labels:
    app.kubernetes.io/name: carbonshift
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbonshift-controller-sa
  namespace: carbonshift-system
  labels:
    app.kubernetes.io/name: carbonshift-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carbonshift-controller-role
  labels:
    app.kubernetes.io/name: carbonshift-controller
rules:
  # Least-privilege: Only manage pods for scheduling gate admission and nodeAffinity assignment
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # CarbonJob custom resources
  - apiGroups: ["carbonshift.io"]
    resources: ["carbonjobs", "carbonjobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Events for auditing
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carbonshift-controller-rolebinding
  labels:
    app.kubernetes.io/name: carbonshift-controller
subjects:
  - kind: ServiceAccount
    name: carbonshift-controller-sa
    namespace: carbonshift-system
roleRef:
  kind: ClusterRole
  name: carbonshift-controller-role
  apiGroup: rbac.authorization.k8s.io
