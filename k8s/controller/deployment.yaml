apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonshift-controller
  namespace: carbonshift-system
  labels:
    app.kubernetes.io/name: carbonshift-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carbonshift-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbonshift-controller
    spec:
      serviceAccountName: carbonshift-controller-sa
      containers:
        - name: controller
          image: carbonshift/controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: API_ENDPOINT
              value: "http://carbonshift-api.carbonshift-system.svc.cluster.local:8000"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
